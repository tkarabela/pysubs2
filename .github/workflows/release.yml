name: Release

# Publishes to PyPI using Trusted Publishing (OIDC) - no API token needed.
# Run manually from the Actions tab, selecting the release tag as the ref.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match VERSION in pysubs2/common.py)"
        required: true
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
      - name: Check version matches input
        run: |
          declared=$(uv run --locked --no-dev python -c "import pysubs2.common; print(pysubs2.common.VERSION)")
          echo "Declared version: $declared"
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::VERSION in pysubs2/common.py is '$declared', expected '${{ inputs.version }}'"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Show built artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pysubs2
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true
